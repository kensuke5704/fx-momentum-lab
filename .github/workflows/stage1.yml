name: stage1-research

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Fetch BIS monthly FX data
        run: python scripts/fetch_bis.py
      - name: Run preregistered Stage 1
        run: python scripts/run_stage1.py
      - name: Upload Stage 1 results
        uses: actions/upload-artifact@v4
        with:
          name: stage1-results
          path: results/stage1/
          retention-days: 30
